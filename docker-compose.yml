services:
  pdf-powerhouse:
    container_name: pdf-powerhouse
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-powerhouse:latest
    ports:
      - "5000:5090"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5090
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    restart: unless-stopped
    volumes:
      - pdf-powerhouse-data:/app/tessdata
      - ./hotfolders:/app/hotfolders
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5090/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pdf-powerhouse-data:
    name: pdf-powerhouse-data
