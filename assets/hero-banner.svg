<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="417" fill="none" stroke="#1e293b" stroke-width="2" rx="15" />
  <rect x="2" y="2" width="1196" height="3" fill="url(#primaryGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#3b82f6" fill-opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="1000" cy="280" r="160" fill="#8b5cf6" fill-opacity="0.12" filter="url(#glowFilter)" />

  <!-- Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SOVEREIGN &amp; ZERO-CLOUD</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    PDF <tspan fill="url(#primaryGlow)">POWERHOUSE</tspan> 🚀
  </text>

  <!-- Subtitle -->
  <text x="62" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    High-Performance PDF Processing Suite • .NET 9 + Native Google PDFium C++
  </text>

  <!-- Feature Cards Grid (Bottom) -->
  <g transform="translate(60, 240)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="120" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="250" height="2" fill="#3b82f6" />
    <text x="20" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ Google PDFium Native</text>
    <text x="20" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Hardware-accelerated C++</text>
    <text x="20" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">300 DPI rendering in &lt;15ms</text>
    <text x="20" y="102" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ In-Memory Streaming</text>

    <!-- Card 2 -->
    <rect x="275" y="0" width="250" height="120" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
    <rect x="275" y="0" width="250" height="2" fill="#8b5cf6" />
    <text x="295" y="38" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🔐 Cryptography &amp; PAdES</text>
    <text x="295" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">PKCS#7 &amp; X.509 stamps</text>
    <text x="295" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AES-256 multi-tier security</text>
    <text x="295" y="102" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ ETSI TS 102 778 Standard</text>

    <!-- Card 3 -->
    <rect x="550" y="0" width="250" height="120" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
    <rect x="550" y="0" width="250" height="2" fill="#06b6d4" />
    <text x="570" y="38" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚖️ PDF/A &amp; OCR Engine</text>
    <text x="570" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">ISO 19005-1 &amp; ISO 19005-2</text>
    <text x="570" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Offline Tesseract 5 OCR</text>
    <text x="570" y="102" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ Table Matrix to CSV/Excel</text>

    <!-- Card 4 -->
    <rect x="825" y="0" width="255" height="120" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1" />
    <rect x="825" y="0" width="255" height="2" fill="#10b981" />
    <text x="845" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📂 Hot Folders &amp; Batch</text>
    <text x="845" y="65" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Headless auto-watchdog</text>
    <text x="845" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lock protection &amp; audit trail</text>
    <text x="845" y="102" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✓ 100% Free &amp; MIT License</text>
  </g>
</svg>
